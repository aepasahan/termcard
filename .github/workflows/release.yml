name: Release

# Publishes every package whose current version is not yet on npm.
# When termcard itself is released, it also attaches the Claude Desktop extension
# (termcard.mcpb) to a GitHub release and updates the official MCP Registry entry.
# Run manually (Actions → Release → Run workflow) or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance: proves each release was built from this repository
    outputs:
      termcard: ${{ steps.publish.outputs.termcard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # termcard first: create-termcard depends on it.
      - name: Publish
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a public repository.
          PROVENANCE: ${{ github.event.repository.private && '' || '--provenance' }}
        run: |
          for pkg in termcard create-termcard; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish --workspace "packages/$pkg" --access public $PROVENANCE
              echo "$pkg=$version" >> "$GITHUB_OUTPUT"
            fi
          done

  extension:
    needs: npm
    if: needs.npm.outputs.termcard != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/termcard/mcpb/build.js dist
      - name: Create GitHub release with the Claude Desktop extension
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.npm.outputs.termcard }}
        run: |
          gh release create "termcard-v$VERSION" dist/termcard.mcpb \
            --title "termcard $VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/aepasahan/termcard/blob/main/CHANGELOG.md). Install the Claude Desktop extension by opening **termcard.mcpb**."

  mcp-registry:
    needs: npm
    if: needs.npm.outputs.termcard != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs in to the MCP Registry as this GitHub repository's owner
    steps:
      - uses: actions/checkout@v7
      - name: Set the released version in server.json
        env:
          VERSION: ${{ needs.npm.outputs.termcard }}
        run: |
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = process.env.VERSION;
            s.packages.forEach((p) => { p.version = process.env.VERSION; });
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2));
          "
      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
