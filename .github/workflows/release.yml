name: Release

# Publishes every package whose current version is not yet on npm.
# Run manually (Actions → Release → Run workflow) or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance: proves each release was built from this repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # termcard first: create-termcard depends on it.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a public repository.
          PROVENANCE: ${{ github.event.repository.private && '' || '--provenance' }}
        run: |
          for pkg in termcard create-termcard; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish --workspace "packages/$pkg" --access public $PROVENANCE
            fi
          done
